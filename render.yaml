# Render Blueprint: одна кнопка создаёт PostgreSQL и backend (Docker).
# Секреты (ADMIN_TOKEN, CORS_ORIGINS) Render попросит ввести в дашборде — в репозитории их нет.
databases:
  - name: caspian-db
    plan: free
    region: frankfurt
    databaseName: caspian_breeze
    user: caspian

services:
  - type: web
    name: caspian-breeze-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caspian-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: OSRM_URL
        value: https://routing.openstreetmap.de/routed-foot
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
